name: Tankpreise erfassen

on:
  schedule:
    # Alle 10 Minuten, 04:00 bis 20:50 UTC (Sommer 06:00 bis 22:50 Uhr, Winter 05:00 bis 21:50 Uhr Ortszeit)
    - cron: "*/10 4-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tankpreise
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Preise abrufen
        env:
          TANKERKOENIG_KEY: ${{ secrets.TANKERKOENIG_KEY }}
          STATION_REWE: ${{ vars.STATION_REWE }}
          STATION_ENI: ${{ vars.STATION_ENI }}
        run: python3 tankpreise.py collect

      - name: CSV speichern
        run: |
          git config user.name "tankpreise-bot"
          git config user.email "tankpreise-bot@users.noreply.github.com"
          git add tankpreise.csv
          git diff --cached --quiet && exit 0
          git commit -m "Preise $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
