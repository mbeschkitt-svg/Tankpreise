name: Tankpreise erfassen

on:
  # Ausloeser: cron-job.org ruft workflow_dispatch auf (:08 und :38, Europe/Berlin)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tankpreise
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Preise abrufen
        env:
          TANKERKOENIG_KEY: ${{ secrets.TANKERKOENIG_KEY }}
          STATION_REWE: ${{ vars.STATION_REWE }}
          STATION_ENI: ${{ vars.STATION_ENI }}
        run: python3 tankpreise.py collect

      - name: CSV speichern
        run: |
          git config user.name "tankpreise-bot"
          git config user.email "tankpreise-bot@users.noreply.github.com"
          git add tankpreise.csv
          git diff --cached --quiet && exit 0
          git commit -m "Preise $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
